[project]
name = "latent-walk"
version = "0.1.0"
description = "Interactive random walks through a tiny image model's latent space"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.9,<2",
    "diffusers>=0.35,<0.40",
    "fastapi>=0.116,<1",
    "pillow>=11,<13",
    "safetensors>=0.5,<1",
    "torch>=2.7,<3",
    "transformers>=4.53,<5",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
